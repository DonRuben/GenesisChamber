# Render.com Blueprint — Genesis Chamber V4
# Deploy: Dashboard > New > Blueprint > connect this repo
services:
  - type: web
    name: genesis-chamber
    runtime: static
    plan: free
    buildCommand: cd genesis-chamber-v4 && npm install && npm run build
    staticPublishPath: genesis-chamber-v4/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
